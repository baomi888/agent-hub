<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暂时连不上 · 知穗Agent</title>
<meta name="theme-color" content="#EDE4C8">
<style>
  :root {
    --paper: #EDE4C8;
    --paper-2: #F5EEDB;
    --ink: #3D2F1A;
    --ink-soft: #7A6A4E;
    --gold: #C8892A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1A1610;
      --paper-2: #241E15;
      --ink: #EFE6D2;
      --ink-soft: #A99C82;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 380px;
    width: 100%;
    text-align: center;
    background: var(--paper-2);
    border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
    border-radius: 20px;
    padding: 40px 28px 32px;
  }
  img {
    width: 96px;
    height: 96px;
    display: block;
    margin: 0 auto 20px;
  }
  h1 {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0 0 10px;
  }
  p {
    font-size: 14px;
    line-height: 1.75;
    color: var(--ink-soft);
    margin: 0 0 24px;
  }
  button {
    appearance: none;
    border: 0;
    border-radius: 12px;
    background: var(--ink);
    color: var(--paper-2);
    font-size: 15px;
    font-family: inherit;
    padding: 13px 30px;
    cursor: pointer;
    min-height: 46px;
  }
  button:active { opacity: 0.82; }
  .hint {
    margin: 18px 0 0;
    font-size: 12px;
    color: var(--ink-soft);
    opacity: 0.75;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/mascot.svg" alt="知穗吉祥物">
    <h1>现在连不上网络</h1>
    <p>可能是信号不稳，或者服务正在更新。<br>检查一下网络，再点下面的按钮。</p>
    <button type="button" onclick="location.reload()">重新加载</button>
    <p class="hint">已经打开的对话会在恢复网络后自动同步。</p>
  </div>
</body>
</html>
