# -*- coding: utf-8 -*-
#
# 现代 Python 项目元数据与工具配置。
#
# ⚠️ 运行时依赖的「唯一真相源」仍是根目录的 requirements.txt
#    （deploy.sh 用它装生产依赖，格式受限只能 `#` 注释）。
#    本文件仅承载：项目元数据（PyPI/工具可读）、开发期工具链（ruff/black）、
#    以及可选的 dev 依赖。不要在这里重复列运行时依赖，避免两份漂移。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baomi-agent"
version = "0.1.0"
description = "知穗 Agent —— 基于 RAG 知识库与 LangChain Agent 的个人知识助手"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jinghao Feng", email = "fenjinghao@example.com" }]
keywords = ["rag", "agent", "langchain", "knowledge-base", "chatbot", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
# 2026-10-27 从 100 调到 120：历史代码里有 59 行落在 100~120 之间，
# 逐行重排会产生一个 50+ 文件的纯格式提交，把真实改动埋掉。
# 调到 120 是"不再新增超长行"的可执行门槛，同时不为难已有代码。
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes（基础）；I: isort；UP: pyupgrade；B: flake8-bugbear
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402"]  # 测试文件在 import 后做 sys.path 注入，允许后导入

[tool.ruff.lint.per-file-ignores]
# 文档目录下的一次性图表/示例脚本：不随生产发布，不追新语法与行长
"docs/**" = ["E501", "UP031"]
# TOOL_PLAYBOOK 是给模型看的中文散文（五工具 × 四节）。按 120 列硬折行会把
# 一句完整的话切成两半，既影响可读性也影响提示词本身的质量，故免检行长。
"core/tool_registry.py" = ["E501"]

[tool.black]
line-length = 120
target-version = ["py311"]
