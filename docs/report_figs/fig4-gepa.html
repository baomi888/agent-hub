<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#FDFBF5;font-family:"Microsoft YaHei",sans-serif;}svg{display:block;}</style>
</head>
<body>
<svg width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8892A"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#FDFBF5"/>
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#3B2C18">Prompt 自进化闭环：上线必须过评估集这道闸</text>
  <text x="600" y="78" text-anchor="middle" font-size="15" fill="#8A7B63">变异一代 → 离线评估 → 不达标就打回 —— 提示词改动从此有回归测试</text>

  <!-- loop nodes arranged in circle -->
  <!-- center 600, 340 ; r 190 -->
  <!-- node positions: top(600,150) right-top(880,230) right-bottom(880,450) left-bottom(320,450) left-top(320,230) -->
  <g font-family="Microsoft YaHei">
    <!-- 1 top -->
    <rect x="480" y="110" width="240" height="84" rx="12" fill="#FBF3E4" stroke="#C8892A" stroke-width="2"/>
    <text x="600" y="145" text-anchor="middle" font-size="16.5" font-weight="700" fill="#3B2C18">① 采集真实 badcase</text>
    <text x="600" y="172" text-anchor="middle" font-size="13" fill="#8A7B63">用户点踩 / 溯源失败 / 人工标注</text>

    <!-- 2 right top -->
    <rect x="830" y="218" width="250" height="84" rx="12" fill="#FBF3E4" stroke="#C8892A" stroke-width="2"/>
    <text x="955" y="253" text-anchor="middle" font-size="16.5" font-weight="700" fill="#3B2C18">② 固化进评估集</text>
    <text x="955" y="280" text-anchor="middle" font-size="13" fill="#8A7B63">含干扰样本，防"背答案"</text>

    <!-- 3 right bottom -->
    <rect x="830" y="418" width="250" height="84" rx="12" fill="#FBF3E4" stroke="#C8892A" stroke-width="2"/>
    <text x="955" y="453" text-anchor="middle" font-size="16.5" font-weight="700" fill="#3B2C18">③ GEPA 反思变异</text>
    <text x="955" y="480" text-anchor="middle" font-size="13" fill="#8A7B63">按失败归因定向改提示词</text>

    <!-- 4 left bottom -->
    <rect x="120" y="418" width="250" height="84" rx="12" fill="#F4EBD8" stroke="#8A5A17" stroke-width="2.5"/>
    <text x="245" y="453" text-anchor="middle" font-size="16.5" font-weight="700" fill="#3B2C18">④ 离线评估打分</text>
    <text x="245" y="480" text-anchor="middle" font-size="13" fill="#8A7B63">recall / AUC / 溯源率全过才算赢</text>

    <!-- 5 left top -->
    <rect x="120" y="218" width="250" height="84" rx="12" fill="#FBF3E4" stroke="#C8892A" stroke-width="2"/>
    <text x="245" y="253" text-anchor="middle" font-size="16.5" font-weight="700" fill="#3B2C18">⑤ 达标才允许上线</text>
    <text x="245" y="280" text-anchor="middle" font-size="13" fill="#8A7B63">不达标 → 回 ③ 继续变异</text>
  </g>

  <!-- arrows forming loop -->
  <g stroke="#C8892A" stroke-width="2.5" fill="none">
    <path d="M 720 152 Q 800 170 848 218" marker-end="url(#a4)"/>
    <path d="M 955 302 Q 960 350 955 412" marker-end="url(#a4)"/>
    <path d="M 830 460 Q 620 520 376 466" marker-end="url(#a4)"/>
    <path d="M 245 418 Q 240 360 245 308" marker-end="url(#a4)"/>
    <path d="M 370 240 Q 430 190 474 160" marker-end="url(#a4)"/>
  </g>

  <!-- fail path -->
  <path d="M 370 470 Q 600 590 830 492" stroke="#B03A2B" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#a4)"/>
  <text x="600" y="580" text-anchor="middle" font-size="13" fill="#B03A2B">评估不达标：打回重新变异（红色虚线），不会流入线上</text>

  <!-- center label -->
  <circle cx="600" cy="335" r="72" fill="#fff" stroke="#C8892A" stroke-width="2"/>
  <text x="600" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#3B2C18">提示词工程</text>
  <text x="600" y="352" text-anchor="middle" font-size="13" fill="#8A7B63">从手艺变成工程</text>
</svg>
</body>
</html>
