<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#FDFBF5;font-family:"Microsoft YaHei",sans-serif;}
  svg{display:block;}
</style>
</head>
<body>
<svg width="1400" height="700" viewBox="0 0 1400 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A7B63"/>
    </marker>
  </defs>
  <rect width="1400" height="700" fill="#FDFBF5"/>
  <text x="700" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#3B2C18">知穗 Agent 四层能力结构</text>
  <text x="700" y="84" text-anchor="middle" font-size="16" fill="#8A7B63">上层只依赖下层接口，各层可独立替换 —— 校内部署与云端部署共用同一套代码</text>

  <!-- Layer 1 -->
  <rect x="120" y="110" width="1160" height="120" rx="14" fill="#FBF3E4" stroke="#C8892A" stroke-width="2"/>
  <rect x="120" y="110" width="150" height="120" rx="14" fill="#C8892A"/>
  <text x="195" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">应用层</text>
  <text x="195" y="186" text-anchor="middle" font-size="13" fill="#FBF3E4">学生直接感知</text>
  <g font-size="15" fill="#3B2C18">
    <rect x="300" y="132" width="220" height="76" rx="10" fill="#fff" stroke="#E3D5B8"/>
    <text x="410" y="163" text-anchor="middle" font-weight="700">对话（流式）</text>
    <text x="410" y="188" text-anchor="middle" font-size="12.5" fill="#8A7B63">场景化提问 · 逐条溯源</text>
    <rect x="545" y="132" width="220" height="76" rx="10" fill="#fff" stroke="#E3D5B8"/>
    <text x="655" y="163" text-anchor="middle" font-weight="700">每日委托</text>
    <text x="655" y="188" text-anchor="middle" font-size="12.5" fill="#8A7B63">定时任务 · 自动执行</text>
    <rect x="790" y="132" width="220" height="76" rx="10" fill="#fff" stroke="#E3D5B8"/>
    <text x="900" y="163" text-anchor="middle" font-weight="700">每日总结</text>
    <text x="900" y="188" text-anchor="middle" font-size="12.5" fill="#8A7B63">结论压成卡片 · 指回原话</text>
    <rect x="1035" y="132" width="220" height="76" rx="10" fill="#fff" stroke="#E3D5B8"/>
    <text x="1145" y="163" text-anchor="middle" font-weight="700">打卡分享</text>
    <text x="1145" y="188" text-anchor="middle" font-size="12.5" fill="#8A7B63">分享前自动脱敏</text>
  </g>

  <!-- Layer 2 -->
  <rect x="120" y="258" width="1160" height="120" rx="14" fill="#F4EBD8" stroke="#C8892A" stroke-width="2"/>
  <rect x="120" y="258" width="150" height="120" rx="14" fill="#A66E1F"/>
  <text x="195" y="306" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Agent 层</text>
  <text x="195" y="334" text-anchor="middle" font-size="13" fill="#FBF3E4">决策与编排</text>
  <g font-size="15" fill="#3B2C18">
    <rect x="300" y="280" width="300" height="76" rx="10" fill="#fff" stroke="#E3D5B8"/>
    <text x="450" y="311" text-anchor="middle" font-weight="700">编排内核（规划-执行-反思）</text>
    <text x="450" y="336" text-anchor="middle" font-size="12.5" fill="#8A7B63">最多 6 轮工具循环，超时兜底</text>
    <rect x="625" y="280" width="300" height="76" rx="10" fill="#fff" stroke="#E3D5B8"/>
    <text x="775" y="311" text-anchor="middle" font-weight="700">5 个工具</text>
    <text x="775" y="336" text-anchor="middle" font-size="12.5" fill="#8A7B63">kb_search · web_search · calculator · weather · download</text>
    <rect x="950" y="280" width="305" height="76" rx="10" fill="#fff" stroke="#E3D5B8"/>
    <text x="1102" y="311" text-anchor="middle" font-weight="700">约束注入</text>
    <text x="1102" y="336" text-anchor="middle" font-size="12.5" fill="#8A7B63">kb_id 服务端注入 · grounding 强制遵守</text>
  </g>

  <!-- Layer 3 -->
  <rect x="120" y="406" width="1160" height="120" rx="14" fill="#FBF3E4" stroke="#C8892A" stroke-width="2"/>
  <rect x="120" y="406" width="150" height="120" rx="14" fill="#8A5A17"/>
  <text x="195" y="454" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">检索层</text>
  <text x="195" y="482" text-anchor="middle" font-size="13" fill="#FBF3E4">答得准的核心</text>
  <g font-size="15" fill="#3B2C18">
    <rect x="300" y="428" width="220" height="76" rx="10" fill="#fff" stroke="#E3D5B8"/>
    <text x="410" y="459" text-anchor="middle" font-weight="700">混合召回</text>
    <text x="410" y="484" text-anchor="middle" font-size="12.5" fill="#8A7B63">向量 top40 + BM25 top40</text>
    <rect x="545" y="428" width="220" height="76" rx="10" fill="#fff" stroke="#E3D5B8"/>
    <text x="655" y="459" text-anchor="middle" font-weight="700">RRF 融合 + 重排</text>
    <text x="655" y="484" text-anchor="middle" font-size="12.5" fill="#8A7B63">精排 top8 进上下文</text>
    <rect x="790" y="428" width="220" height="76" rx="10" fill="#fff" stroke="#E3D5B8"/>
    <text x="900" y="459" text-anchor="middle" font-weight="700">置信度分级</text>
    <text x="900" y="484" text-anchor="middle" font-size="12.5" fill="#8A7B63">HIGH / MEDIUM / LOW</text>
    <rect x="1035" y="428" width="220" height="76" rx="10" fill="#fff" stroke="#E3D5B8"/>
    <text x="1145" y="459" text-anchor="middle" font-weight="700">溯源闸门</text>
    <text x="1145" y="484" text-anchor="middle" font-size="12.5" fill="#8A7B63">指不回原文的结论直接丢弃</text>
  </g>

  <!-- Layer 4 -->
  <rect x="120" y="554" width="1160" height="110" rx="14" fill="#F4EBD8" stroke="#C8892A" stroke-width="2"/>
  <rect x="120" y="554" width="150" height="110" rx="14" fill="#6E4A12"/>
  <text x="195" y="600" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">数据层</text>
  <text x="195" y="628" text-anchor="middle" font-size="13" fill="#FBF3E4">本地优先</text>
  <g font-size="15" fill="#3B2C18">
    <rect x="300" y="574" width="300" height="70" rx="10" fill="#fff" stroke="#E3D5B8"/>
    <text x="450" y="603" text-anchor="middle" font-weight="700">知识库（Chroma 向量库）</text>
    <text x="450" y="627" text-anchor="middle" font-size="12.5" fill="#8A7B63">按 kb_id 物理隔离 · 越权不可达</text>
    <rect x="625" y="574" width="300" height="70" rx="10" fill="#fff" stroke="#E3D5B8"/>
    <text x="775" y="603" text-anchor="middle" font-weight="700">会话与任务（SQLite）</text>
    <text x="775" y="627" text-anchor="middle" font-size="12.5" fill="#8A7B63">消息 · 委托 · 总结 · 令牌黑名单</text>
    <rect x="950" y="574" width="305" height="70" rx="10" fill="#fff" stroke="#E3D5B8"/>
    <text x="1102" y="603" text-anchor="middle" font-weight="700">评估与审计</text>
    <text x="1102" y="627" text-anchor="middle" font-size="12.5" fill="#8A7B63">评估集 · 压测记录 · 静默失效清单</text>
  </g>

  <!-- arrows -->
  <g stroke="#8A7B63" stroke-width="2">
    <line x1="700" y1="230" x2="700" y2="254" marker-end="url(#arr)"/>
    <line x1="700" y1="378" x2="700" y2="402" marker-end="url(#arr)"/>
    <line x1="700" y1="526" x2="700" y2="550" marker-end="url(#arr)"/>
  </g>
  <text x="720" y="247" font-size="12" fill="#8A7B63">调用</text>
  <text x="720" y="395" font-size="12" fill="#8A7B63">检索</text>
  <text x="720" y="543" font-size="12" fill="#8A7B63">读写</text>
</svg>
</body>
</html>
