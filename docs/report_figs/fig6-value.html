<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#FDFBF5;font-family:"Microsoft YaHei",sans-serif;}svg{display:block;}</style>
</head>
<body>
<svg width="1400" height="560" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8892A"/>
    </marker>
  </defs>
  <rect width="1400" height="560" fill="#FDFBF5"/>
  <text x="700" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#3B2C18">社会价值传导链：每条都锚定一个已落地机制</text>
  <text x="700" y="78" text-anchor="middle" font-size="15" fill="#8A7B63">不是口号 —— 左侧价值主张都能在右侧找到一个真实存在的系统机制</text>

  <g font-family="Microsoft YaHei">
    <!-- row template: y = 120, 205, 290, 375, 460 -->
    <!-- headers -->
    <text x="330" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#8A7B63">价值主张</text>
    <text x="1030" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#8A7B63">对应的已落地机制</text>

    <!-- 1 -->
    <rect x="70" y="126" width="520" height="64" rx="12" fill="#FBF3E4" stroke="#C8892A" stroke-width="2"/>
    <text x="330" y="152" text-anchor="middle" font-size="15.5" font-weight="700" fill="#3B2C18">对抗 AI 幻觉，守住学习真实性</text>
    <text x="330" y="176" text-anchor="middle" font-size="12.5" fill="#8A7B63">学生不被"看着像对"的答案带偏</text>
    <rect x="770" y="126" width="520" height="64" rx="12" fill="#fff" stroke="#E3D5B8"/>
    <text x="1030" y="152" text-anchor="middle" font-size="14" fill="#3B2C18">置信度分级 + 溯源闸门</text>
    <text x="1030" y="176" text-anchor="middle" font-size="12.5" fill="#8A7B63">LOW 强制拒答；结论指不回原文直接丢弃</text>

    <!-- 2 -->
    <rect x="70" y="211" width="520" height="64" rx="12" fill="#FBF3E4" stroke="#C8892A" stroke-width="2"/>
    <text x="330" y="237" text-anchor="middle" font-size="15.5" font-weight="700" fill="#3B2C18">AI 素养教育：教"怎么用"，不替答案</text>
    <text x="330" y="261" text-anchor="middle" font-size="12.5" fill="#8A7B63">模板广场每张卡都写明"答案要你自己来"</text>
    <rect x="770" y="211" width="520" height="64" rx="12" fill="#fff" stroke="#E3D5B8"/>
    <text x="1030" y="237" text-anchor="middle" font-size="14" fill="#3B2C18">场景模板 + 诚实口径交互</text>
    <text x="1030" y="261" text-anchor="middle" font-size="12.5" fill="#8A7B63">生成失败如实告知，不编造成功状态</text>

    <!-- 3 -->
    <rect x="70" y="296" width="520" height="64" rx="12" fill="#FBF3E4" stroke="#C8892A" stroke-width="2"/>
    <text x="330" y="322" text-anchor="middle" font-size="15.5" font-weight="700" fill="#3B2C18">分享激励学习而非炫耀</text>
    <text x="330" y="346" text-anchor="middle" font-size="12.5" fill="#8A7B63">打卡图只讲知识结构，不露个人信息</text>
    <rect x="770" y="296" width="520" height="64" rx="12" fill="#fff" stroke="#E3D5B8"/>
    <text x="1030" y="322" text-anchor="middle" font-size="14" fill="#3B2C18">分享前自动脱敏</text>
    <text x="1030" y="346" text-anchor="middle" font-size="12.5" fill="#8A7B63">剥离姓名/学号/原话，无排行榜无连击奖励</text>

    <!-- 4 -->
    <rect x="70" y="381" width="520" height="64" rx="12" fill="#FBF3E4" stroke="#C8892A" stroke-width="2"/>
    <text x="330" y="407" text-anchor="middle" font-size="15.5" font-weight="700" fill="#3B2C18">缩小数字鸿沟</text>
    <text x="330" y="431" text-anchor="middle" font-size="12.5" fill="#8A7B63">资源较弱院校也部署得起</text>
    <rect x="770" y="381" width="520" height="64" rx="12" fill="#fff" stroke="#E3D5B8"/>
    <text x="1030" y="407" text-anchor="middle" font-size="14" fill="#3B2C18">单服务器 200 并发 0 错误 · 蒸馏降本路线</text>
    <text x="1030" y="431" text-anchor="middle" font-size="12.5" fill="#8A7B63">普通服务器即可承载一个院系</text>

    <!-- 5 -->
    <rect x="70" y="466" width="520" height="64" rx="12" fill="#FBF3E4" stroke="#C8892A" stroke-width="2"/>
    <text x="330" y="492" text-anchor="middle" font-size="15.5" font-weight="700" fill="#3B2C18">数据主权归还学校与学生</text>
    <text x="330" y="516" text-anchor="middle" font-size="12.5" fill="#8A7B63">学习数据不该是平台的资产</text>
    <rect x="770" y="466" width="520" height="64" rx="12" fill="#fff" stroke="#E3D5B8"/>
    <text x="1030" y="492" text-anchor="middle" font-size="14" fill="#3B2C18">本地优先存储 + 一键导出/删除</text>
    <text x="1030" y="516" text-anchor="middle" font-size="12.5" fill="#8A7B63">SQLite 本地库 · 知识库按 kb_id 物理隔离</text>
  </g>

  <!-- arrows -->
  <g stroke="#C8892A" stroke-width="2.5">
    <line x1="590" y1="158" x2="764" y2="158" marker-end="url(#a6)"/>
    <line x1="590" y1="243" x2="764" y2="243" marker-end="url(#a6)"/>
    <line x1="590" y1="328" x2="764" y2="328" marker-end="url(#a6)"/>
    <line x1="590" y1="413" x2="764" y2="413" marker-end="url(#a6)"/>
    <line x1="590" y1="498" x2="764" y2="498" marker-end="url(#a6)"/>
  </g>
</svg>
</body>
</html>
