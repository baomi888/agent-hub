<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#FDFBF5;font-family:"Microsoft YaHei",sans-serif;}svg{display:block;}</style>
</head>
<body>
<svg width="1400" height="520" viewBox="0 0 1400 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8892A"/>
    </marker>
  </defs>
  <rect width="1400" height="520" fill="#FDFBF5"/>
  <text x="700" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#3B2C18">商业化三步走：先在一个校园里跑通，再谈扩张</text>
  <text x="700" y="78" text-anchor="middle" font-size="15" fill="#8A7B63">每一步都有可验证的里程碑，不达标不进入下一步 —— 不做无依据的营收预测</text>

  <!-- step cards -->
  <g font-family="Microsoft YaHei">
    <!-- step1 -->
    <rect x="70" y="120" width="380" height="290" rx="16" fill="#FBF3E4" stroke="#C8892A" stroke-width="2"/>
    <rect x="70" y="120" width="380" height="64" rx="16" fill="#C8892A"/>
    <text x="260" y="150" text-anchor="middle" font-size="13" fill="#FBF3E4">第 1 步 · 0–6 个月</text>
    <text x="260" y="174" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">校内验证</text>
    <g font-size="14.5" fill="#3B2C18">
      <text x="100" y="222">· 课程群 / 院系试点</text>
      <text x="100" y="254">· 免费，打磨留存与口碑</text>
      <text x="100" y="286">· 跑通"资料不出校"本地部署</text>
    </g>
    <rect x="95" y="308" width="330" height="76" rx="10" fill="#fff" stroke="#E3D5B8"/>
    <text x="260" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#8A5A17">里程碑</text>
    <text x="260" y="362" text-anchor="middle" font-size="13" fill="#5A4632">周活跃留存 ≥ 40% · 溯源投诉率 &lt; 1%</text>

    <!-- step2 -->
    <rect x="510" y="120" width="380" height="290" rx="16" fill="#FBF3E4" stroke="#C8892A" stroke-width="2"/>
    <rect x="510" y="120" width="380" height="64" rx="16" fill="#A66E1F"/>
    <text x="700" y="150" text-anchor="middle" font-size="13" fill="#FBF3E4">第 2 步 · 6–18 个月</text>
    <text x="700" y="174" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">区域复制</text>
    <g font-size="14.5" fill="#3B2C18">
      <text x="540" y="222">· 同城高校联盟推广</text>
      <text x="540" y="254">· 面向院系收部署服务费</text>
      <text x="540" y="286">· 模板市场 + 教师版雏形</text>
    </g>
    <rect x="535" y="308" width="330" height="76" rx="10" fill="#fff" stroke="#E3D5B8"/>
    <text x="700" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#8A5A17">里程碑</text>
    <text x="700" y="362" text-anchor="middle" font-size="13" fill="#5A4632">3 所以上高校付费部署 · 单校续约</text>

    <!-- step3 -->
    <rect x="950" y="120" width="380" height="290" rx="16" fill="#F4EBD8" stroke="#8A5A17" stroke-width="2.5"/>
    <rect x="950" y="120" width="380" height="64" rx="16" fill="#8A5A17"/>
    <text x="1140" y="150" text-anchor="middle" font-size="13" fill="#FBF3E4">第 3 步 · 18 个月+</text>
    <text x="1140" y="174" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">开放平台</text>
    <g font-size="14.5" fill="#3B2C18">
      <text x="980" y="222">· API 与模板生态开放</text>
      <text x="980" y="254">· To B 授权 + 增值服务</text>
      <text x="980" y="286">· 蒸馏本地模型，成本再降一档</text>
    </g>
    <rect x="975" y="308" width="330" height="76" rx="10" fill="#fff" stroke="#E3D5B8"/>
    <text x="1140" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#8A5A17">里程碑</text>
    <text x="1140" y="362" text-anchor="middle" font-size="13" fill="#5A4632">开发者入驻 · 生态收入覆盖云成本</text>
  </g>

  <!-- arrows -->
  <g stroke="#C8892A" stroke-width="3">
    <line x1="450" y1="265" x2="504" y2="265" marker-end="url(#a5)"/>
    <line x1="890" y1="265" x2="944" y2="265" marker-end="url(#a5)"/>
  </g>

  <!-- bottom note -->
  <rect x="70" y="436" width="1260" height="56" rx="12" fill="#fff" stroke="#E3D5B8"/>
  <text x="700" y="470" text-anchor="middle" font-size="14" fill="#5A4632">成本结构：单用户月云成本约 ¥0.35（KV 缓存命中后）→ 蒸馏小模型上线后趋近电费；收入引擎是部署与服务，不是卖广告</text>
</svg>
</body>
</html>
