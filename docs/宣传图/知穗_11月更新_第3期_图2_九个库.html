<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>知穗 · 11 月更新 第 3 期 图 2 · 九个库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --step-0: #EDE4C8;
    --step-1: #F5F0E1;
    --step-2: #FDFAF2;
    --desk-0: #F3EAD8;
    --ink: #3D2F1A;
    --ink-2: #5A4C33;
    --ink-3: #6F6044;
    --accent: #C8892A;
    --accent-ink: #7A510D;
    --line: rgba(61, 47, 26, 0.12);
    --line-strong: rgba(61, 47, 26, 0.26);
    --serif: "Noto Serif SC", "Songti SC", serif;
    --sans: "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }

  html, body { width: 1080px; height: 1440px; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--desk-0);
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(61, 47, 26, 0.10) 1px, transparent 1px);
    background-size: 16px 16px;
    opacity: .55;
  }

  .sheet {
    position: absolute;
    left: 38px; right: 38px; top: 30px; bottom: 28px;
    background: var(--step-2);
    border: 1px solid var(--line-strong);
    box-shadow: 0 16px 40px rgba(61, 47, 26, .13);
    padding: 44px 64px 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  .sheet::before {
    content: "";
    position: absolute;
    left: 28px; top: 36px; bottom: 36px;
    width: 1px;
    background-image: repeating-linear-gradient(to bottom, var(--line-strong) 0 7px, transparent 7px 15px);
    opacity: .65;
  }

  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .brand { font-family: var(--serif); font-size: 23px; letter-spacing: .16em; }
  .brand .dot { color: var(--accent); margin: 0 6px; }
  .issue { font-size: 18px; letter-spacing: .1em; color: var(--ink-3); }
  .issue em { font-style: normal; color: var(--accent-ink); }

  /* 与图 1 左对齐形成节奏差：这一张的整体标题右对齐 */
  .top { text-align: right; }
  .kicker {
    margin-top: 26px;
    font-size: 20px;
    letter-spacing: .18em;
    color: var(--accent-ink);
  }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 92px;
    line-height: 1.06;
    letter-spacing: .04em;
    margin-top: 6px;
    white-space: nowrap;
  }
  .sub {
    margin-top: 12px;
    margin-left: auto;
    max-width: 700px;
    font-size: 25px;
    line-height: 1.62;
    color: var(--ink-2);
  }
  .sub b { font-weight: 500; color: var(--ink); }

  /* ---------- 资料墙：九本书并排立着 ----------
     ★ 第一稿把份数映射到**高度**，出来的样子是一张柱状图（底下一排整齐的数字
       更是雪上加霜）。书架上的一套书高度是齐的，厚薄才不一样 —— 所以：
         · 高度统一（456），只做 ±6 的错落，避免机械
         · **宽度**按份数（flex-grow），19 份最厚、2 份最薄
         · **底色深浅**也按份数（双重编码，远看也有层次）
         · 份数写在书脊内底部，不再在地面线下排一排数字
     底下那条 4px 深线是架面，不是坐标轴。 */
  /* 书墙与架面必须包在一起：分开当 sheet 的 flex 子项时，
     space-between 会在书底和架面之间插一段空白，书就"浮"起来了 */
  .shelfwrap { display: flex; flex-direction: column; }
  .wall {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    margin-top: 30px;
  }
  .spine {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 456px;
    border: 1.5px solid rgba(61, 47, 26, .34);
    border-radius: 3px 3px 0 0;
    box-shadow: inset -5px 0 0 rgba(61, 47, 26, .07), inset 5px 0 0 rgba(255, 253, 246, .5);
    overflow: hidden;
  }
  /* 书头、书脚：真书脊上下各有一条压出来的横带 */
  .spine::before, .spine::after {
    content: "";
    flex: none;
    width: 100%;
    height: 13px;
    background: rgba(200, 137, 42, .52);
    border-bottom: 1px solid rgba(61, 47, 26, .28);
  }
  .spine::after { border-bottom: 0; border-top: 1px solid rgba(61, 47, 26, .28); }
  .spine .nm {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
    padding: 10px 0;
  }
  /* 书名上下的两道装饰线：没有它们，这一排就是九块色卡 */
  .spine .nm::before, .spine .nm::after {
    content: "";
    flex: none;
    width: 46%;
    height: 1.5px;
    background: rgba(61, 47, 26, .22);
  }
  .spine .nm span {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: var(--serif);
    font-size: 22px;
    line-height: 1.14;
    letter-spacing: .04em;
    color: var(--ink);
  }
  .spine .pcs {
    flex: none;
    font-size: 13px;
    letter-spacing: .02em;
    color: var(--accent-ink);
    padding-bottom: 9px;
  }
  /* 架面：一块层板，不是一条坐标轴 */
  .floor {
    height: 14px;
    background: linear-gradient(#E9DBB7, #D8C69B);
    border: 1px solid rgba(61, 47, 26, .34);
    border-top-color: rgba(61, 47, 26, .5);
    border-radius: 0 0 3px 3px;
    box-shadow: 0 3px 9px rgba(61, 47, 26, .13);
  }

  .cap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    margin-top: 26px;
    padding: 16px 22px;
    border: 1px dashed var(--line-strong);
    border-radius: 8px;
    background: var(--step-1);
    font-size: 21px;
    color: var(--ink-2);
  }
  .cap b { font-weight: 500; color: var(--accent-ink); }
  .dl {
    flex: none;
    font-size: 19px;
    letter-spacing: .06em;
    color: var(--accent-ink);
    border: 1px solid rgba(200, 137, 42, .5);
    border-radius: 999px;
    padding: 6px 16px;
    background: rgba(200, 137, 42, .1);
  }

  /* ---------- 底部（与图 1 同一块）---------- */
  .foot {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 20px 0 26px;
    border-top: 1px solid var(--line);
  }
  .qrbox {
    width: 214px; height: 214px;
    background: #fff;
    padding: 8px;
    border: 1px solid var(--line-strong);
    box-shadow: 0 7px 18px rgba(61, 47, 26, .10);
    flex: none;
  }
  .qrbox img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .foot-txt { padding-bottom: 2px; }
  .foot-title { font-family: var(--serif); font-size: 38px; line-height: 1.2; }
  .foot-url { margin-top: 6px; font-size: 24px; letter-spacing: .06em; color: var(--accent-ink); }
  .foot-note { margin-top: 8px; font-size: 18px; line-height: 1.6; color: var(--ink-3); }
  .foot-note span { display: block; }
  .mascot { margin-left: auto; width: 112px; height: 112px; flex: none; }
  .mascot svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>

    <div class="cap">

      <span class="dl">在线阅读 · 下载 ↓</span>
    </div>

    <div class="foot">
      <div class="qrbox"><img src="qr_myzhisui.png" alt="扫码打开知穗"></div>

      </div>
