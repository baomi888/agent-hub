# -*- coding: utf-8 -*-
#
# pytest 收集范围说明
# -------------------
# tests/ 里混着两种文件：
#   1. pytest 风格（定义 test_* 函数）—— 由 pytest 收集执行；
#   2. 脚本式自测（模块级执行 + sys.exit / assert 结尾）—— 设计上就是
#      `python tests/test_xxx.py` 直接跑的，不该被 pytest 收集。
#
# 脚本式文件被 pytest 收集时会整段在「收集阶段」执行，两个副作用：
#   - 每个文件都 monkeypatch core.session._db_path 到自己的临时目录，
#     而 core.account 的建表只会在进程内跑一次（import 缓存），一旦先被
#     别的模块导入，users 表就建到了真实库，临时库里没有 → "no such table: users"；
#   - sys.exit / assert 直接抛在收集阶段，pytest 报一堆和测试本身无关的 error。
#
# 所以这里把脚本式自测逐文件 ignore，跑 pytest 就只剩 17 个 pytest 风格用例。

[pytest]
addopts =
    --ignore=tests/test_auth_gate.py
    --ignore=tests/test_geo_locate.py
    --ignore=tests/test_kb_isolation.py
    --ignore=tests/test_owner_isolation.py
    --ignore=tests/test_retrieve_select.py
    --ignore=tests/test_slash_no_redirect.py
    --ignore=tests/test_w1.py
    --ignore=tests/test_w2.py
    --ignore=tests/test_w3.py
    # 2026-10-13 新增：工具注册表自测（脚本式，模块级 sys.exit）
    --ignore=tests/test_tool_registry.py
