# 知穗 · Nginx 反向代理
#
# 【备案通过前，IP 直连】用 80 端口转发到 3000，链接从 http://IP:3000 变成 http://IP
#   cp ops/nginx-baomi.conf /etc/nginx/conf.d/baomi.conf
#   rm -f /etc/nginx/sites-enabled/default     # ← 见下方说明，必做
#   nginx -t && systemctl reload nginx
#   然后把安全组 + 本机防火墙的 80 放行，3000 可以收回（见文末）
#
# ⚠️ Ubuntu/Debian 自带的 /etc/nginx/sites-enabled/default 同样 listen 80 + server_name _，
#    会报 `conflicting server name "_" on 0.0.0.0:80, ignored`。当前能通只是因为
#    nginx.conf 里 conf.d/*.conf 的 include 顺序在 sites-enabled/* 之前，本文件侥幸排在前面。
#    这是靠顺序取胜，任何一次 include 调整或换台机器都会变成「打开是 Welcome to nginx」。
#    所以必须删掉默认站点，让 80 只有一个 server，结果才是确定的。
#
# 【备案通过后，加 HTTPS】只需要改 server_name，再跑一条 certbot：
#   sed -i 's/server_name _;/server_name myzhisui.cn www.myzhisui.cn;/' /etc/nginx/conf.d/baomi.conf
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d myzhisui.cn -d www.myzhisui.cn
#   certbot 会自动追加 443、证书与 80→443 跳转，本文件不用手写 SSL 配置。
#
# ⚠️ 合规提示：未备案的域名不能解析到大陆 ECS 对外提供网站服务。
#    用纯 IP 访问属于过渡期应急做法，正式对外宣传仍需等备案号下来。

server {
    listen 80;
    server_name _;

    # 知识库单文件上限 100MB（后端 MAX_UPLOAD_MB=100）。Nginx 默认 1MB，
    # 不改这里的话，用户传一份 PPT 就会直接 413，而前端拿到的只是"上传失败"。
    client_max_body_size 100m;

    # 长任务（生成总结 20~40s、文档解析、向量化重建）都要时间，超时给足
    proxy_connect_timeout 15s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    access_log /var/log/nginx/baomi-access.log;
    error_log  /var/log/nginx/baomi-error.log;

    # SSE 流式问答：必须单独一段并关闭缓冲。
    # 开着 proxy_buffering 时，Nginx 会在服务端把整段回答攒完再一次性吐给浏览器，
    # 用户看到的是"卡十几秒 → 突然出现全文"，流式等于白做。
    location /api/chat {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}

# 切到 80 之后，把 3000 收回只为本机（前端服务改听 127.0.0.1）：
#   改 /root/frontend/package.json 的 start 没用，Next 读的是 PORT 环境变量，
#   托管模式下改 unit 里两行即可：
#     systemctl edit --full baomi-frontend
#       ExecStart=/usr/bin/npm run start -- -H 127.0.0.1
#     systemctl daemon-reload && systemctl restart baomi-frontend
